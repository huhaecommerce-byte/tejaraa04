<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 96 96" width="96" height="96">
  <title>Tejaraa</title>
  <desc>Tejaraa brand mark: dark green hexagonal box outline with a gold folded corner.</desc>
  <rect x="0" y="0" width="96" height="96" fill="#ffffff"/>
  <!-- Hexagonal box outline -->
  <path d="M48 8 L84 28 L84 68 L48 88 L12 68 L12 28 Z"
        fill="none" stroke="#06442A" stroke-width="6.5"
        stroke-linejoin="miter" stroke-miterlimit="4"/>
  <!-- Inner T bar -->
  <path d="M30 40 L48 50 L66 40" fill="none" stroke="#06442A" stroke-width="6.5" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <path d="M48 50 L48 82" fill="none" stroke="#06442A" stroke-width="6.5"/>
  <!-- Gold folded corner -->
  <path d="M62 12 L86 24 L86 40 L62 28 Z" fill="#CAA648"/>
  <path d="M86 24 L92 32 L92 48 L86 40 Z" fill="#B3923C"/>
</svg>
